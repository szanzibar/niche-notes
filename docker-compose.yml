services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - data:/data
    environment:
      PHX_HOST: ${PHX_HOST}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      POCKET_ID_URL: ${POCKET_ID_URL}

volumes:
  data:
