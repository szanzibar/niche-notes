plugins {
    id 'com.android.application'
}

// Signing comes from keystore.properties next to this project, which stays out of git. Without it the APK is unsigned.
def keystore = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

// The server this app opens and the app's id, from the same names the server's `.env` uses: CI passes
// repository variables, build.sh passes `.env`. The defaults only keep a bare checkout building.
def host = System.getenv('PHX_HOST') ?: 'notes.example.com'

android {
    namespace 'app.nichenotes'
    compileSdk 36
    defaultConfig {
        applicationId System.getenv('ANDROID_APP_ID') ?: 'app.nichenotes'
        manifestPlaceholders = [host: host]
        resValue 'string', 'site', "https://$host"
        // Lets Chrome open the site without an address bar, together with the server's assetlinks.json.
        resValue 'string', 'asset_statements',
            '[{\\"relation\\": [\\"delegate_permission/common.handle_all_urls\\"], \\"target\\": {\\"namespace\\": \\"web\\", \\"site\\": \\"https://' + host + '\\"}}]'
        // Android 12 gives widgets a scrolling list without a separate list service.
        minSdk 31
        targetSdk 36
        // Android installs an update only over a lower versionCode, so VERSION is the commit count.
        versionCode = Integer.parseInt(System.getenv('VERSION') ?: '1')
        versionName = System.getenv('VERSION') ?: 'dev'
        // Builds update themselves from their repository's releases: CI names it, and build.sh reads the origin remote.
        def repo = System.getenv('GITHUB_REPOSITORY')
        buildConfigField 'String', 'RELEASES', repo ? "\"https://api.github.com/repos/$repo/releases/latest\"" : 'null'
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystore.storeFile)
                storePassword keystore.storePassword
                keyAlias keystore.keyAlias
                keyPassword keystore.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile.exists() ? signingConfigs.release : null
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
