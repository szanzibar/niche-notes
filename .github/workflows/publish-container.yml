name: Publish Container

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The server pulls the new image right away instead of on Watchtower's daily pass. The reply waits for the
      # update, so a failed one fails this step.
      - name: Update the server
        if: github.event_name != 'pull_request' && vars.WATCHTOWER_URL != ''
        env:
          TOKEN: ${{ secrets.WATCHTOWER_TOKEN }}
        run: |
          curl -fsS --max-time 600 -X POST -H "Authorization: Bearer $TOKEN" "${{ vars.WATCHTOWER_URL }}/v1/update?image=ghcr.io/${{ github.repository }}"
