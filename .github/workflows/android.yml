name: Android APK

# The APK only wraps the site, so a web change never needs a new one.
on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    # The same image android/build.sh uses locally.
    container: ghcr.io/cirruslabs/android-sdk:36
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Signing key from secrets
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "$KEYSTORE_PROPERTIES" > keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}

      - name: Build
        id: build
        working-directory: android
        env:
          PHX_HOST: ${{ vars.PHX_HOST }}
          ANDROID_APP_ID: ${{ vars.ANDROID_APP_ID }}
        run: |
          : "${PHX_HOST:?set the PHX_HOST repository variable}" "${ANDROID_APP_ID:?set the ANDROID_APP_ID repository variable}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export VERSION=$(git rev-list --count HEAD)
          ./gradlew --no-daemon assembleRelease
          mv app/build/outputs/apk/release/app-release.apk niche-notes-$VERSION.apk
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ steps.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Niche Notes ${{ steps.build.outputs.version }}
          files: android/niche-notes-*.apk
