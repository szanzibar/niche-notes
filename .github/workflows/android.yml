name: Android APK

# The app only wraps the site, so a web change never needs a new one.
on:
  push:
    branches:
      - main
    paths:
      - "tauri/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Signing key and Firebase settings from secrets
        working-directory: tauri/gen/android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "$KEYSTORE_PROPERTIES" > keystore.properties
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # In the same image tauri/android.sh builds locally.
      - name: Build
        id: build
        env:
          PHX_HOST: ${{ vars.PHX_HOST }}
          ANDROID_APP_ID: ${{ vars.ANDROID_APP_ID }}
        run: |
          : "${PHX_HOST:?set the PHX_HOST repository variable}" "${ANDROID_APP_ID:?set the ANDROID_APP_ID repository variable}"
          tauri/android.sh
          version=$(git rev-list --count HEAD)
          cp tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk niche-notes-$version.apk
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish as a release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: android-${{ steps.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Niche Notes ${{ steps.build.outputs.version }}
          files: niche-notes-*.apk
